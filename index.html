<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eta Multi Language Translator</title>
  <style>
    body {
      font-family: sans-serif;
      background: #020617;
      color: #e5e7eb;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #0f172a;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,.4);
    }
    h1 { font-size: 18px; margin-bottom: 12px; }
    textarea, select, button {
      width: 100%;
      margin-bottom: 12px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      background: #22c55e;
      color: #022c22;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌍 ترنسلیت دقیق چندزبانه</h1>

    <textarea id="sourceText" placeholder="متن را وارد کن..."></textarea>

    <select id="sourceLang">
      <option value="auto">تشخیص خودکار</option>
      <option value="fa">فارسی</option>
      <option value="en">English</option>
      <option value="ar">العربية</option>
      <option value="ru">Русский</option>
    </select>

    <select id="targetLang">
      <option value="en">English</option>
      <option value="fa">فارسی</option>
      <option value="ar">العربية</option>
      <option value="ru">Русский</option>
      <option value="tr">Türkçe</option>
    </select>

    <button onclick="translateText()">ترجمه کن</button>

    <textarea id="resultText" placeholder="ترجمه اینجا میاد..." readonly></textarea>
  </div>

  <script>
    async function translateText() {
      const text = document.getElementById('sourceText').value.trim();
      const source = document.getElementById('sourceLang').value;
      const target = document.getElementById('targetLang').value;

      if (!text) return alert('متن خالیه');

      try {
        // API آزاد و دقیق LibreTranslate
        const res = await fetch('https://libretranslate.de/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            q: text,
            source: source,
            target: target,
            format: 'text'
          })
        });

        const data = await res.json();
        document.getElementById('resultText').value = data.translatedText;
      } catch (e) {
        alert('خطا در ترجمه. اینترنت یا API');
      }
    }
  </script>
</body>
</html>
